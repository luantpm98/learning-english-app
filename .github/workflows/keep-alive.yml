name: Keep Render Server Awake

on:
  schedule:
    # Ping every 5 minutes so even with GitHub Actions cron jitter, Render stays awake (<15m)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "Pinging Render backend..."
          curl -s --retry 2 --max-time 60 -o /dev/null -w "HTTP Status: %{http_code}\n" https://learning-english-app-lqg7.onrender.com/health || true
